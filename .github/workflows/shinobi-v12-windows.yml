# Isolated build branch; this workflow does not publish portfolio.
name: Shinobi V12 Godot 4.5.2 Windows QA
on:
  workflow_dispatch:
  push:
    branches: ['build/shinobi-alpha-v02-rework-20261015']
permissions:
  contents: read
jobs:
  validate-and-export:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact source archive plus latest code overlay
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = [System.IO.File]::Create('source.zip')
          try {
            Get-ChildItem 'source.zip.part*' | Sort-Object Name | ForEach-Object {
              $data = [System.IO.File]::ReadAllBytes($_.FullName)
              $out.Write($data,0,$data.Length)
            }
          } finally { $out.Dispose() }
          Expand-Archive source.zip -DestinationPath . -Force
          if (Test-Path overlay) { Copy-Item overlay/* project/ -Recurse -Force }
          if (Test-Path alpha_overlay.zip) { Expand-Archive alpha_overlay.zip -DestinationPath . -Force }
          if (Test-Path alpha_readable) { Copy-Item alpha_readable/* project/ -Recurse -Force }
      - uses: lihop/setup-godot@v3
        with:
          version: 4.5.2-stable
          export-templates: true
      - name: Select synchronous console executable
        shell: pwsh
        run: |
          $cli = Get-ChildItem "$pwd/v4.5.2-stable" -Filter '*console.exe' -Recurse | Select-Object -First 1
          if (!$cli) { throw 'Godot console executable missing' }
          Add-Content $env:GITHUB_ENV "GODOT_CLI=$($cli.FullName)"
          New-Item -ItemType Directory -Force -Path logs | Out-Null
      - name: Import Godot scripts/assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:GODOT_CLI --headless --path project --editor --import --quit *> logs/import.txt
          if ($LASTEXITCODE -ne 0) { Get-Content logs/import.txt; throw 'Godot import failed' }
          if (Select-String -Path logs/import.txt -Pattern 'SCRIPT ERROR|Parse Error|Failed to load script') { throw 'Import parse error' }
      - name: Gameplay QA
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          & $env:GODOT_CLI --headless --path project --script res://tests/qa_runtime.gd *> logs/qa_runtime.txt
          if ($LASTEXITCODE -ne 0) { throw 'QA runtime failed' }
          & $env:GODOT_CLI --headless --path project --script res://tests/qa_v11.gd *> logs/qa_v11.txt
          if ($LASTEXITCODE -ne 0) { throw 'QA V11 failed' }
          & $env:GODOT_CLI --headless --path project --script res://tests/qa_v10_5.gd *> logs/qa_v10_5.txt
          if ($LASTEXITCODE -ne 0) { throw 'QA V10.5 failed' }
          & $env:GODOT_CLI --headless --path project --script res://tests/qa_v12.gd *> logs/qa_v12.txt
          if ($LASTEXITCODE -ne 0) { throw 'QA V12 failed' }
      - name: ALPHA character and 252-talent QA
        shell: pwsh
        run: |
          & $env:GODOT_CLI --headless --path project --script res://tests/qa_alpha.gd *> logs/qa_alpha.txt
          if ($LASTEXITCODE -ne 0) { Get-Content logs/qa_alpha.txt; throw 'ALPHA QA failed' }
      - name: ALPHA gameplay ability QA (36 signatures, six basic styles, branch exclusion)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:GODOT_CLI --headless --path project --script res://tests/qa_alpha_abilities.gd *> logs/qa_alpha_abilities.txt
          if ($LASTEXITCODE -ne 0) { Get-Content logs/qa_alpha_abilities.txt; throw 'ALPHA abilities QA failed' }
      - name: ALPHA personal jutsu / sprite integrity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:GODOT_CLI --headless --path project --script res://tests/qa_alpha_class_jutsu.gd *> logs/qa_alpha_class_jutsu.txt
          if ($LASTEXITCODE -ne 0) { Get-Content logs/qa_alpha_class_jutsu.txt; throw 'ALPHA class jutsu QA failed' }
      - name: Alpha v0.2 P1 fixed-step x5 + menu + Sasuke & Gaara regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:GODOT_CLI --headless --path project --script res://tests/qa_alpha_v02_p1.gd *> logs/qa_alpha_v02_p1.txt
          if ($LASTEXITCODE -ne 0) { Get-Content logs/qa_alpha_v02_p1.txt; throw 'Alpha v0.2 P1 regression failed' }
      - name: ALPHA P2 actual Lee / Neji melee and 64 palms QA
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:GODOT_CLI --headless --path project --script res://tests/qa_alpha_v02_melee.gd *> logs/qa_alpha_v02_melee.txt
          if ($LASTEXITCODE -ne 0) { Get-Content logs/qa_alpha_v02_melee.txt; throw 'Alpha P2 melee QA failed' }
      - name: ALPHA v0.2 P9 Dojo training mode QA
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:GODOT_CLI --headless --path project --script res://tests/qa_alpha_v02_dojo.gd *> logs/qa_alpha_v02_dojo.txt
          if ($LASTEXITCODE -ne 0) { Get-Content logs/qa_alpha_v02_dojo.txt; throw 'Alpha Dojo regression failed' }
      - name: Windows software-render screenshots
        continue-on-error: true
        shell: pwsh
        run: |
          & $env:GODOT_CLI --path project --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/qa_v12_visual.gd -- "$pwd/logs/windows_visual" *> logs/windows_visual.txt
          if ($LASTEXITCODE -ne 0) { Get-Content logs/windows_visual.txt; throw 'Windows GUI render failed' }
      - name: ALPHA visual evidence (all six MUGEN characters and talent page)
        continue-on-error: true
        shell: pwsh
        run: |
          & $env:GODOT_CLI --path project --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/qa_alpha_visual.gd -- "$pwd/logs/alpha_visual" *> logs/qa_alpha_visual.txt
          if ($LASTEXITCODE -ne 0) { Get-Content logs/qa_alpha_visual.txt; throw 'Alpha screenshots failed' }
      - name: Pack ALL raw assets as Godot PCK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $src = (Resolve-Path project).Path.Replace('\','/')
          $pck = (Join-Path (Resolve-Path release).Path 'game.pck').Replace('\','/')
          & $env:GODOT_CLI --headless --path project --script res://scripts/build_pack.gd -- $src $pck *> logs/pack.txt
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $pck)) { throw 'PCK build failed' }
      - name: Assemble standalone Windows EXE with embedded PCK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $template = Get-ChildItem "$env:APPDATA\Godot\export_templates" -Filter windows_release_x86_64.exe -Recurse | Select-Object -First 1
          if (!$template) { throw 'Windows Godot export template not found' }
          $exe = Join-Path (Resolve-Path release).Path 'ShinobiSurvivors.exe'
          $pck = Join-Path (Resolve-Path release).Path 'game.pck'
          $stream = [System.IO.File]::Create($exe)
          try {
            $engine = [System.IO.File]::ReadAllBytes($template.FullName)
            $stream.Write($engine, 0, $engine.Length)
            while ($stream.Position % 8 -ne 0) { $stream.WriteByte(0) }
            $data = [System.IO.File]::ReadAllBytes($pck)
            $stream.Write($data, 0, $data.Length)
            $length = [BitConverter]::GetBytes([UInt64]$data.Length)
            $stream.Write($length, 0, 8)
            $magic = [System.Text.Encoding]::ASCII.GetBytes('GDPC')
            $stream.Write($magic, 0, 4)
          } finally { $stream.Dispose() }
      - name: Test EXACT standalone exe on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path release/ShinobiSurvivors.exe).Path
          $p = Start-Process -FilePath $exe -ArgumentList @('--headless','--quit-after','120') -Wait -PassThru -NoNewWindow -RedirectStandardOutput logs/exe-out.txt -RedirectStandardError logs/exe-err.txt
          if ($p.ExitCode -ne 0) { throw "Standalone EXE failed $($p.ExitCode)" }
          if (Select-String -Path logs/exe-out.txt,logs/exe-err.txt -Pattern 'SCRIPT ERROR|Parse Error|Failed to load script|ERROR:') { throw 'Runtime error(s) in exported EXE' }
          $q = Start-Process -FilePath $exe -ArgumentList @('--headless','--script','res://tests/qa_v12.gd') -Wait -PassThru -NoNewWindow -RedirectStandardOutput logs/exe-qa.txt -RedirectStandardError logs/exe-qa-errors.txt
          if ($q.ExitCode -ne 0) { throw 'Exported EXE V12 suite failed' }
          if (Select-String -Path logs/exe-qa.txt,logs/exe-qa-errors.txt -Pattern 'SCRIPT ERROR|Parse Error|Failed to load script|ERROR:') { throw 'Exported EXE suite runtime error' }
          Get-FileHash $exe -Algorithm SHA256 | Format-List | Out-File logs/SHA256.txt
          Remove-Item release/game.pck
          Compress-Archive -Path release/* -DestinationPath ShinobiSurvivors_Windows.zip
      - name: Archive full editable source for recovery
        shell: pwsh
        run: |
          if (!(Test-Path project/project.godot)) { throw 'Project source missing' }
          Compress-Archive -Path project -DestinationPath ShinobiSurvivors_V12_Source.zip -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shinobi-windows-and-QA
          path: |
            ShinobiSurvivors_Windows.zip
            ShinobiSurvivors_V12_Source.zip
            logs/
          retention-days: 10

