name: Diagnose portfolio view tracking
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/diagnose_views.mjs"
      - ".github/workflows/diagnose-views.yml"
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compare GoatCounter aggregated views and portfolio paths
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: node scripts/diagnose_views.mjs
