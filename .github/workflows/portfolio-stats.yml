name: Update encrypted portfolio dashboard
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/portfolio_stats_secure.mjs"
      - "scripts/ninja-report.mjs"
      - ".github/workflows/portfolio-stats.yml"
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
concurrency:
  group: encrypted-portfolio-dashboard
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'wiktorszczepaniak/portfolio'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build encrypted data without publishing API credentials
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        shell: bash
        run: |
          if [ -z "$GOATCOUNTER_TOKEN" ]; then
            echo "::notice::Add GOATCOUNTER_TOKEN in repository Actions secrets to activate the dashboard."
            exit 0
          fi
          node scripts/portfolio_stats_secure.mjs
      - name: Publish encrypted file to GitHub Pages source
        shell: bash
        run: |
          if [ ! -f studio-insights-8f42c/data.enc.json ]; then
            echo "No encrypted report generated; previous report remains unchanged."
            exit 0
          fi
          set -euo pipefail
          report_path="studio-insights-8f42c/data.enc.json"
          snapshot_path="$RUNNER_TEMP/ninja-snapshot.enc.json"
          cp "$report_path" "$snapshot_path"
          new_time=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).updated_at)' "$snapshot_path")
          git config user.name 'portfolio-analytics[bot]'
          git config user.email 'portfolio-analytics@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            # Reset only this disposable CI checkout; keep its generated report in RUNNER_TEMP.
            git reset --hard origin/main
            if [ -f "$report_path" ]; then
              current_time=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).updated_at)' "$report_path")
              if [[ "$current_time" > "$new_time" ]]; then
                echo "A newer encrypted report was published by another run. Keeping it."
                exit 0
              fi
            fi
            cp "$snapshot_path" "$report_path"
            git add "$report_path"
            if git diff --cached --quiet; then
              echo "Encrypted snapshot already current."
              exit 0
            fi
            git commit -m 'Refresh encrypted analytics snapshot'
            if git push origin HEAD:main; then
              echo "Updated encrypted report successfully."
              exit 0
            fi
            echo "Concurrent update detected; retrying ($attempt/4)."
            sleep 3
          done
          echo "::error::Could not safely publish the encrypted dashboard report after four attempts."
          exit 1
